<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- La Pitaya brand mark (PitayaCode). Original pixel art: a pitaya (dragon
       fruit) on a sand tile. Drawn for La Pitaya; replaces the upstream mark,
       which was a portrait of an upstream cast character. -->
  <title>La Pitaya</title>
  <rect width="16" height="16" fill="#F4E4C1"/>
  <!-- leaf tips -->
  <rect x="7" y="1" width="2" height="2" fill="#3F8F3A"/>
  <rect x="4" y="3" width="2" height="1" fill="#3F8F3A"/>
  <rect x="10" y="3" width="2" height="1" fill="#3F8F3A"/>
  <!-- fruit body -->
  <rect x="5" y="3" width="6" height="1" fill="#D6246E"/>
  <rect x="4" y="4" width="8" height="1" fill="#D6246E"/>
  <rect x="3" y="5" width="10" height="7" fill="#D6246E"/>
  <rect x="4" y="12" width="8" height="1" fill="#D6246E"/>
  <rect x="5" y="13" width="6" height="1" fill="#B01A58"/>
  <!-- green scales -->
  <rect x="3" y="6" width="2" height="1" fill="#4FA84A"/>
  <rect x="11" y="6" width="2" height="1" fill="#4FA84A"/>
  <rect x="7" y="5" width="2" height="1" fill="#4FA84A"/>
  <rect x="5" y="9" width="2" height="1" fill="#4FA84A"/>
  <rect x="9" y="9" width="2" height="1" fill="#4FA84A"/>
  <rect x="7" y="11" width="2" height="1" fill="#4FA84A"/>
  <!-- highlight -->
  <rect x="5" y="6" width="1" height="2" fill="#F06AA0"/>
</svg>
